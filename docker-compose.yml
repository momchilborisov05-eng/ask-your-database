# Local run with Docker:  docker compose up --build   ->  http://localhost:8000
# Without an API key it starts in demo mode (example questions only).
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-0}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.00}
    volumes:
      - askdb-data:/data
    restart: unless-stopped

volumes:
  askdb-data:
